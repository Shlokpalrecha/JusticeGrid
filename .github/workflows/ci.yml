name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"
  DATABASE_URL: postgresql://justicegrid:justicegrid@127.0.0.1:5432/justicegrid_test
  TEST_DATABASE_URL: postgresql://justicegrid:justicegrid@127.0.0.1:5432/justicegrid_test
  E2E_DATABASE_URL: postgresql://justicegrid:justicegrid@127.0.0.1:5432/justicegrid_test
  JWT_SECRET: ci-test-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-characters
  TZ: Asia/Kolkata

jobs:
  static-checks:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @justicegrid/api run db:generate
      - run: pnpm typecheck
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm lint
      - run: pnpm format:check

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: justicegrid
          POSTGRES_PASSWORD: justicegrid
          POSTGRES_DB: justicegrid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U justicegrid -d justicegrid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @justicegrid/api run db:generate
      - run: pnpm --filter @justicegrid/api run db:migrate:deploy
      - run: pnpm test
      - run: pnpm systems:stress
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/rules-engine/coverage
            apps/api/coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @justicegrid/api run db:generate
      - run: pnpm build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: justicegrid
          POSTGRES_PASSWORD: justicegrid
          POSTGRES_DB: justicegrid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U justicegrid -d justicegrid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @justicegrid/api run db:generate
      - run: pnpm --filter @justicegrid/api run db:migrate:deploy
      - run: pnpm --filter @justicegrid/api run db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
